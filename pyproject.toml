[project]
name = "oligomd"
version = "0.1.0"
description = "MD-Pipeline für Nukleinsäure-Komplexe mit modifizierten Bausteinen"
requires-python = ">=3.11"
dependencies = ["numpy", "pyyaml", "pydantic>=2", "rdkit"]

[project.scripts]
oligomd = "oligomd.__main__:main"

[tool.setuptools.packages.find]
include = ["oligomd*", "agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
