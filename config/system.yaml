# Was gerechnet wird. Siehe oligomd/config.py für alle Felder und Grenzen.
#
# 7PDU: vorkatalytischer Komplex des 10-23-DNAzyms mit seinem RNA-Substrat,
# NMR-Struktur (Borggräfe et al., Nature 601, 144-149, 2022).
#
# Was in der Datei steht (geprüft mit "python -m oligomd info"):
#   7 Modelle, je 1658 Atome, Wasserstoffe vorhanden
#   Kette A  33 DNA-Reste,  Nummern 1-33   TTGGGGTAAGGCTCGCTACAACGAGGTGCATGT
#   Kette B  19 RNA-Reste,  Nummern 34-52  ACAUGCACCGUUACCCCAA
#   Kein Magnesium, kein Wasser in den Koordinaten
#   Gesamtladung der Standardreste: -50
#
# Phase 1 rechnet diesen Komplex unmodifiziert. Das ist der Referenzlauf.

struktur:
  pdb: eingaben/7pdu.xml.gz
  # NMR: 7 Modelle. Modell 1 ist der Startpunkt; für unabhängige Wiederholungen
  # später andere Modelle als eigene Läufe rechnen.
  modell: 1
  ketten: [A, B]          # A = DNAzym, B = RNA-Substrat
  entfernen: []           # die Datei enthält kein Wasser
  behalten_hetatm: []     # und keine Ionen

kraftfeld:
  dna: OL21               # aktuelles Amber-DNA-Kraftfeld
  rna: OL3                # aktuelles Amber-RNA-Kraftfeld
  wasser: OPC
  ionen: Joung-Cheatham   # muss zum Wassermodell passen
  zusatz_frcmod: []       # ab Phase 2: Parameter der Modifikation
  zusatz_lib: []

box:
  typ: oktaeder
  puffer_nm: 1.2

ionen:
  # -50 Ladung heißt: so viele Gegenionen allein zum Ausgleich, dazu das Salz.
  # Die Zusatzionen unten zählen dabei mit (10 Mg2+ bringen +20 mit).
  neutralisieren_mit: K+
  salz_mol_l: 0.15

  # Mg2+ frei in der Lösung, ohne Vorgabe einer Bindestelle.
  #
  # Die NMR-Koordinaten enthalten kein Magnesium, wir kennen die Bindestellen
  # aus dieser Datei also nicht. Statt sie zu raten, kommt das Mg2+ frei in die
  # Box und darf sich selbst anlagern. Wo es landet, ist dann ein Ergebnis und
  # keine Annahme.
  #
  # 0,05 mol/l liegt über der Konzentration im Experiment (dort eher 1 bis
  # 10 mmol/l). Das ist Absicht: Bei 1 mmol/l wäre in einer Box dieser Größe
  # rechnerisch weniger als ein Ion, und das fände seinen Platz in erreichbarer
  # Rechenzeit nie. Die höhere Konzentration beschleunigt das Anlagern. Sie ist
  # eine bewusste Abweichung vom Experiment und gehört später in die Methoden.
  zusaetzlich:
    - {ion: Mg2+, mol_l: 0.05}

# Phase 1 läuft ohne Modifikation.
# Ziel für Phase 2 ist Kette A, Rest 23 (DG) - in der Zählung des katalytischen
# Kerns das G14. Dessen O6 wird modifiziert.
modifikation: null
# modifikation:
#   rest: {kette: A, nummer: 23}
#   definition: config/residues/o6_beispiel.yaml
#   name: G6X
